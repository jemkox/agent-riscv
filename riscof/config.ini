# RISCOF gate config. Absolute project paths use the @ROOT@ placeholder;
# the `riscof` make target expands it with $(PWD) into $(B)/riscof_work/config.ini.
[RISCOF]
ReferencePlugin=sail_cSim
ReferencePluginPath=@ROOT@/riscof/sail_cSim
DUTPlugin=rv32cpu
DUTPluginPath=@ROOT@/riscof/rv32cpu

[rv32cpu]
pluginpath=@ROOT@/riscof/rv32cpu
ispec=@ROOT@/riscof/rv32cpu/rv32cpu_isa.yaml
pspec=@ROOT@/riscof/rv32cpu/rv32cpu_platform.yaml
jobs=1
target_run=1

[sail_cSim]
pluginpath=@ROOT@/riscof/sail_cSim
jobs=1
PATH=@ROOT@/riscof/sail_ref
